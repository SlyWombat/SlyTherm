# SlyTherm LAN OTA mirror — serving half (Dockge stack "ota-mirror" on kdocker2).
# The populating half is the systemd unit ota-mirror-sync.service (same dir).
# See README.md. Canonical copy lives in the SlyTherm repo: deploy/ota-mirror/.
services:
  ota-mirror:
    image: nginx:1.27-alpine
    container_name: ota-mirror
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./mirror:/srv/mirror:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
