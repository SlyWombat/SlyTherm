# SlyTherm OTA mirror (#129 escape hatch; #182 nginx upgrade; #206 supervised).
# Range support: 1.4.0+ firmware downloads in 16 KB chunks (self-paced, immune
# to everything below). limit_rate exists ONLY for pre-1.4.0 single-full-GET
# clients, and their constraint is two-sided (v1.4.0 rollout, 2026-08-08,
# d2d30c on 1.3.1): full speed panics the esp-hosted SDIO RX pool mid-download;
# a rate >= the reader drain rate builds an unread backlog, and when nginx
# closes after the last byte the 1.3.1 loop aborts on stream->connected()
# with the tail unread ("truncated download" at 87%, twice at 256k). So the
# rate must sit BELOW the reader drain rate: backlog ~0, close race ~0.
# Content integrity is the catalog ECDSA signature + sha256, not transport.
geo $ota_rate {
    default        131072;   # LAN: 128 KB/s (below the 1.3.1 reader drain rate)
    10.20.30.0/24  131072;   # WireGuard peers: same, plus WG overhead headroom
}
server {
    listen 8090;
    root /srv/mirror;
    autoindex off;

    # Sync-loop internals (.hold, .upstream-catalog.json, *.tmp) are never
    # served; the fleet only ever asks for catalog.json + asset basenames.
    location ~ /\. { return 404; }
    location ~ \.tmp$ { return 404; }

    # Freshness signal for monitors — must not be cached anywhere.
    location = /status.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        limit_rate $ota_rate;
        try_files $uri =404;
    }
}
