# SlyLog — optional dockerized observability + prediction stack (#130).
# Strictly READ-ONLY: subscribes MQTT, reads the controller telnet mirror,
# pulls Open-Meteo. Publishes nothing, controls nothing.
#
# Persistence: bind mounts under $DATA_DIR (default /data/slylog) — kdocker2's
# root LV (/var/lib/docker) is nearly full; /data is the 3.4 TB data LV and
# the established home for stack data on this box. Before first up:
#   mkdir -p /data/slylog/{postgres,grafana,ollama,captures}
#   chown 70:70 /data/slylog/postgres && chown 472 /data/slylog/grafana
#   (timescaledb alpine runs postgres as uid 70; grafana as 472; ollama root)
#
# cp .env.example .env  (edit creds)  ->  docker compose up -d

services:
  db:
    # Pinned to the image that was running (2.28.2-pg16, published 2026-06-30) so a
    # recreate or prune can never pull a different database. Upgrade = deliberate re-pin.
    image: timescale/timescaledb:2.28.2-pg16@sha256:ba149561ad4ddff5940d6eb0a0df60aefd1355cee1a450928f271267038fc888
    container_name: slylog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Toronto}
    volumes:
      - ${DATA_DIR:-/data/slylog}/postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"   # host-local admin access only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  collector:
    build: ./collector
    container_name: slylog-collector
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BROKER: ${BROKER}
      BROKER_PORT: ${BROKER_PORT:-1883}
      CONTROLLER_IP: ${CONTROLLER_IP}
      CONTROLLER_PORT: ${CONTROLLER_PORT:-23}
      LAT: ${LAT}
      LON: ${LON}
      FORECAST_HOURS: ${FORECAST_HOURS:-48}
      TZ: ${TZ:-America/Toronto}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      ARCHIVE_PATH: /captures-vol/ct485-live.log
    volumes:
      - ${DATA_DIR:-/data/slylog}/captures:/captures-vol
      # shadow-vs-OEM comparison reports (#139, report_shadow_vs_oem.py)
      - ${DATA_DIR:-/data/slylog}/reports:/reports
      # historical archives for migrate.py — READ-ONLY, never written
      - ${LEGACY_CAPTURES:-/home/dave/SlyTherm/captures}:/legacy-captures:ro

  # #156: publishes the System-tab trend graph series (outside/setpoint/room)
  # to retained slytherm/graph/system. Separate process from the collector,
  # which by design never publishes; reuses the collector image.
  graph-publisher:
    build: ./collector
    container_name: slylog-graph-publisher
    restart: unless-stopped
    command: python -m slylog_collector.graph_publisher
    depends_on:
      db:
        condition: service_healthy
    environment:
      BROKER: ${BROKER}
      BROKER_PORT: ${BROKER_PORT:-1883}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: ${TZ:-America/Toronto}

  # #27 aid: phone-friendly capture-session annotation logger (:8091).
  # Operator logs what they do at the OEM stat; entries are server-timestamped
  # (postgres now(), same clock as raw_frames) into events(kind='annotation').
  annotator:
    build: ./annotator
    container_name: slylog-annotator
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Toronto}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    ports:
      - "8091:8091"

  grafana:
    image: grafana/grafana:latest@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63   # pinned 2026-09-03: was latest
    container_name: slylog-grafana
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3300}:3000"   # 3000/3030 already taken on kdocker2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      TZ: ${TZ:-America/Toronto}
      # consumed by provisioning/datasources/slylog.yml
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_DIR:-/data/slylog}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  ollama:
    # ROCm build + iGPU passthrough (2026-09-03): same device stanza as the other
    # GPU stacks on this host. Pinned to the version that was running (0.31.2).
    image: ollama/ollama:0.31.2-rocm
    container_name: slylog-ollama
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "993"   # render
      - "44"    # video
    # NO host port published: 11434 is already in use on kdocker2.
    # Reachable as http://ollama:11434 on the compose network. Kept as the
    # fallback inference host — the predictor now points at kdocker3 by
    # default (see OLLAMA_URL below).
    volumes:
      - ${DATA_DIR:-/data/slylog}/ollama:/root/.ollama

  predictor:
    build: ./predictor
    container_name: slylog-predictor
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      # kdocker3 (192.168.10.38) carries the GPU ollama with the 30B-class
      # models. Addressed by IP on purpose: container DNS on this box cannot
      # resolve the `kdocker3` hostname. To fall back to the local sidecar,
      # override OLLAMA_URL=http://ollama:11434 in the stack env file.
      #
      # OLLAMA_MODEL is literal, NOT ${OLLAMA_MODEL:-...}: the stack env file
      # still pins the old qwen2.5:7b-instruct, and a literal here wins over
      # it. Drop that stale line when convenient, then this can go back to a
      # ${...} default.
      OLLAMA_URL: ${OLLAMA_URL:-http://192.168.10.38:11434}
      OLLAMA_MODEL: qwen3.6:35b-a3b
      PREDICT_INTERVAL_H: ${PREDICT_INTERVAL_H:-4}
      OLLAMA_TIMEOUT_S: ${OLLAMA_TIMEOUT_S:-900}
      # weather-source confidence review (#141): daily, staggered 30 min after
      # start so it never coincides with a load-forecast run
      CONFIDENCE_INTERVAL_H: ${CONFIDENCE_INTERVAL_H:-24}
      CONFIDENCE_STAGGER_S: ${CONFIDENCE_STAGGER_S:-1800}
      CONFIDENCE_WINDOW_DAYS: ${CONFIDENCE_WINDOW_DAYS:-7}
      TZ: ${TZ:-America/Toronto}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}

  # #181: audit-capture receiver — the camera Remote POSTs a JPEG + metadata
  # here on every manual panel change; review page on :8093. Stdlib-only script,
  # so a bare python image with the source bind-mounted is enough (no build).
  capture-receiver:
    image: python:3.12-alpine
    container_name: slylog-capture-receiver
    restart: unless-stopped
    command: python /app/capture_receiver.py
    ports:
      - "8093:8093"
    volumes:
      - ./capture-receiver:/app:ro
      # NOT /data/slylog/captures — that's the CT-485 frame archive
      - ${DATA_DIR:-/data/slylog}/audit-captures:/captures
    environment:
      TZ: ${TZ:-America/Toronto}
